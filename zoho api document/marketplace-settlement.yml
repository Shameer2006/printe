openapi: 3.0.0
info:
  title: Split
  description: The Split APIs allow you to manage transfers, transfer reversals, and connected accounts for marketplace payments.
  contact: {}
  version: 1.0.0
servers:
  - url: https://payments.zoho.in/api/v1
    description: API Endpoint
tags:
  - name: marketplace-settlement
    description: Split Module
paths:
  /transfers:
    post:
      tags:
        - marketplace-settlement
      summary: Create Transfer
      description: Used to create a transfer for a payment to one or more connected accounts.
      parameters:
        - $ref: '#/components/parameters/account_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-transfer-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create-transfer-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoPay.transfers.CREATE
    get:
      tags:
        - marketplace-settlement
      summary: List Transfers
      description: Used to retrieve the list of transfers.
      parameters:
        - $ref: '#/components/parameters/account_id'
        - $ref: '#/components/parameters/transfer_status'
        - $ref: '#/components/parameters/filter_by'
        - $ref: '#/components/parameters/payment_id_query'
        - $ref: '#/components/parameters/connected_account_id_query'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfer-list-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoPay.transfers.READ
  /transfers/{transfer_id}:
    get:
      tags:
        - marketplace-settlement
      summary: Retrieve Transfer
      description: Used to retrieve the details of a specific transfer.
      parameters:
        - name: transfer_id
          description: The unique identifier of the transfer.
          in: path
          required: true
          schema:
            type: number
            format: long
          example: 6485000000035001
        - $ref: '#/components/parameters/account_id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfer-details-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoPay.transfers.READ
  /transferreversals:
    post:
      tags:
        - marketplace-settlement
      summary: Create Transfer Reversal
      description: Used to create a reversal for an existing transfer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-transfer-reversal-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create-transfer-reversal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoPay.transfers.CREATE
    get:
      tags:
        - marketplace-settlement
      summary: List Transfer Reversals
      description: Used to retrieve the list of transfer reversals.
      parameters:
        - $ref: '#/components/parameters/account_id'
        - $ref: '#/components/parameters/transfer_status'
        - $ref: '#/components/parameters/filter_by'
        - $ref: '#/components/parameters/payment_id_query'
        - $ref: '#/components/parameters/connected_account_id_query'
        - $ref: '#/components/parameters/transfer_id_query'
        - $ref: '#/components/parameters/refund_id_query'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfer-reversal-list-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoPay.transfers.READ
  /connectedaccounts:
    get:
      tags:
        - marketplace-settlement
      summary: List Connected Accounts
      description: Used to retrieve the list of all connected accounts.
      parameters:
        - $ref: '#/components/parameters/account_id'
        - $ref: '#/components/parameters/connected_account_id_query'
        - $ref: '#/components/parameters/filter_by'
        - $ref: '#/components/parameters/from_date'
        - $ref: '#/components/parameters/to_date'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connected-account-list-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoPay.connectedaccounts.READ
  /connectedaccounts/{connected_account_id}:
    get:
      tags:
        - marketplace-settlement
      summary: Retrieve Connected Account
      description: Used to retrieve the details of a specific connected account.
      parameters:
        - $ref: '#/components/parameters/connected_account_id_path'
        - $ref: '#/components/parameters/account_id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connected-account-details-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoPay.connectedaccounts.READ
  /connectedaccounts/{connected_account_id}/payouts:
    get:
      tags:
        - marketplace-settlement
      summary: List Connected Account Payouts
      description: Used to retrieve the list of payouts for a specific connected account.
      parameters:
        - $ref: '#/components/parameters/connected_account_id_path'
        - $ref: '#/components/parameters/account_id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connected-account-payout-list-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoPay.connectedaccounts.READ
  /connectedaccounts/{connected_account_id}/payout/{payout_id}:
    get:
      tags:
        - marketplace-settlement
      summary: Retrieve Connected Account Payout
      description: Used to retrieve the details of a specific payout for a connected account.
      parameters:
        - $ref: '#/components/parameters/connected_account_id_path'
        - name: payout_id
          description: The unique identifier of the payout.
          in: path
          required: true
          schema:
            type: number
            format: long
          example: 3000000054061
        - $ref: '#/components/parameters/account_id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connected-account-payout-details-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoPay.connectedaccounts.READ
  /connectedaccounts/{connected_account_id}/payouts/{payout_id}/transactions:
    get:
      tags:
        - marketplace-settlement
      summary: List Connected Account Payout Transactions
      description: Used to retrieve the list of transactions associated with a specific connected account payout.
      parameters:
        - $ref: '#/components/parameters/connected_account_id_path'
        - name: payout_id
          description: The unique identifier of the payout.
          in: path
          required: true
          schema:
            type: number
            format: long
          example: 3000000054061
        - $ref: '#/components/parameters/account_id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connected-account-payout-transactions-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoPay.connectedaccounts.READ
  /connectedaccounts/{connected_account_id}/transactions:
    get:
      tags:
        - marketplace-settlement
      summary: List Connected Account Transactions
      description: Used to retrieve the list of transactions for connected accounts.
      parameters:
        - name: connected_account_id
          description: The unique identifier of the connected account.
          in: path
          required: true
          schema:
            type: number
            format: long
          example: 3000000004003
        - $ref: '#/components/parameters/account_id'
        - name: sort_column
          description: 'The column to sort by. Allowed values: <code>transaction_time</code>, <code>amount</code>, <code>net_amount</code>, <code>customer_name</code>, <code>available_on</code>, <code>settled_time</code>.'
          in: query
          required: false
          schema:
            type: string
          example: transaction_time
        - name: transaction_type
          description: 'Filter by transaction type. Allowed values: <code>TransactionType.All</code>, <code>TransactionType.Charge</code>, <code>TransactionType.Charge_Reversal</code>, <code>TransactionType.Refund</code>, <code>TransactionType.Payout</code>, <code>TransactionType.Payout_Reversal</code>.'
          in: query
          required: false
          schema:
            type: string
          example: TransactionType.All
        - name: transaction_id
          description: The unique identifier of the transaction.
          in: query
          required: false
          schema:
            type: number
            format: long
        - $ref: '#/components/parameters/filter_by'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connected-account-transactions-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoPay.connectedaccounts.READ
components:
  parameters:
    account_id:
      name: account_id
      description: The Zoho Payments account ID.
      in: query
      required: true
      schema:
        type: number
        format: long
      example: 23137556
    connected_account_id_path:
      name: connected_account_id
      description: The unique identifier of the connected account.
      in: path
      required: true
      schema:
        type: number
        format: long
      example: 6485000000021081
    connected_account_id_query:
      name: connected_account_id
      description: The unique identifier of the connected account.
      in: query
      required: false
      schema:
        type: number
        format: long
      example: 6485000000021081
    payment_id_query:
      name: payment_id
      description: The unique identifier of the payment.
      in: query
      required: false
      schema:
        type: number
        format: long
      example: 6485000000045015
    transfer_id_query:
      name: transfer_id
      description: The unique identifier of the transfer.
      in: query
      required: false
      schema:
        type: number
        format: long
    refund_id_query:
      name: refund_id
      description: The unique identifier of the refund.
      in: query
      required: false
      schema:
        type: number
        format: long
    transfer_status:
      name: status
      description: 'Filter by transfer status. Allowed values: <code>Status.All</code>, <code>Status.Initiated</code>, <code>Status.Success</code>, <code>Status.Failed</code>.'
      in: query
      required: false
      schema:
        type: string
      example: Status.All
    filter_by:
      name: filter_by
      description: 'Filter by date intervals: <code>CreatedDate.Today</code>, <code>CreatedDate.ThisWeek</code>, <code>CreatedDate.ThisMonth</code>, <code>CreatedDate.ThisQuarter</code>, <code>CreatedDate.ThisHalfYear</code>, <code>CreatedDate.ThisYear</code>, <code>CreatedDate.PreviousDay</code>, <code>CreatedDate.PreviousWeek</code>, <code>CreatedDate.PreviousMonth</code>, <code>CreatedDate.PreviousQuarter</code>, <code>CreatedDate.PreviousHalfYear</code>, <code>CreatedDate.PreviousYear</code>, <code>CreatedDate.CustomDate</code>, <code>CreatedDate.Last_7_Days</code>, <code>CreatedDate.Last_30_Days</code>, <code>CreatedDate.Last_90_Days</code>.'
      in: query
      required: false
      schema:
        type: string
      example: CreatedDate.ThisMonth
    from_date:
      name: from_date
      description: If the given <code>filter_by</code> is <code>CreatedDate.CustomDate</code>, this param is required. (e.g., <code>2024-06-06</code>)
      in: query
      required: false
      schema:
        type: string
      example: '2024-06-06'
    to_date:
      name: to_date
      description: If the given <code>filter_by</code> is <code>CreatedDate.CustomDate</code>, this param is required. (e.g., <code>2024-08-30</code>)
      in: query
      required: false
      schema:
        type: string
      example: '2024-08-30'
  schemas:
    gendoc-attributes-schema:
      $ref: '#/components/schemas/transfer-response'
    transfer-split-item:
      type: object
      properties:
        connected_account_id:
          $ref: '#/components/schemas/connected_account_id'
        amount:
          description: The transfer amount for this connected account.
          type: number
          format: double
          example: 20
        description:
          description: A description for this transfer split.
          type: string
          example: 'Transfer for order #1234'
    create-transfer-request:
      type: object
      required:
        - payment_id
        - transfer_split
      properties:
        payment_id:
          description: The unique identifier of the payment to split.
          type: number
          format: long
          example: 6485000000045015
        transfer_split:
          description: List of transfer splits with connected account details.
          type: array
          items:
            $ref: '#/components/schemas/transfer-split-item'
    transfer-split-response-item:
      type: object
      properties:
        net_transfer_amount:
          description: The net transfer amount after deducting fees.
          type: string
          example: '20.24'
        fee_amount:
          description: The fee amount deducted for the transfer.
          type: string
          example: '0.20'
        fee_tax_amount:
          description: The tax amount on the transfer fee.
          type: string
          example: '0.04'
        transfer_amount:
          description: The transfer amount.
          type: string
          example: '20.00'
        currency:
          $ref: '#/components/schemas/currency'
        transfer_id:
          $ref: '#/components/schemas/transfer_id'
        status:
          $ref: '#/components/schemas/transfer_status'
        connected_account_id:
          $ref: '#/components/schemas/connected_account_id'
    create-transfer-response:
      type: object
      properties:
        code:
          type: integer
          example: 0
          readOnly: true
        message:
          type: string
          example: success
          readOnly: true
        data:
          type: object
          properties:
            transfers:
              type: object
              properties:
                splits:
                  type: array
                  items:
                    $ref: '#/components/schemas/transfer-split-response-item'
                status:
                  description: The overall status of the transfer operation.
                  type: string
                  example: success
    transfer-response:
      type: object
      properties:
        transfer_id:
          $ref: '#/components/schemas/transfer_id'
        payment_id:
          $ref: '#/components/schemas/payment_id'
        total_amount:
          $ref: '#/components/schemas/total_amount'
        net_amount:
          $ref: '#/components/schemas/net_amount'
        fee_amount:
          $ref: '#/components/schemas/fee_amount'
        fee_rate:
          $ref: '#/components/schemas/fee_rate'
        fee_tax_amount:
          $ref: '#/components/schemas/fee_tax_amount'
        connected_account_id:
          $ref: '#/components/schemas/connected_account_id'
        description:
          $ref: '#/components/schemas/description'
        status:
          $ref: '#/components/schemas/transfer_status'
        reversed_amount:
          $ref: '#/components/schemas/reversed_amount'
        created_time:
          $ref: '#/components/schemas/created_time'
    transfer-list-response:
      type: object
      properties:
        code:
          type: integer
          example: 0
          readOnly: true
        message:
          type: string
          example: success
          readOnly: true
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/transfer-response'
    transfer-reversal-in-details:
      type: object
      properties:
        reversal_id:
          description: The unique identifier of the reversal.
          type: string
          example: '6485000000035013'
        total_amount:
          $ref: '#/components/schemas/total_amount'
        net_amount:
          $ref: '#/components/schemas/net_amount'
        fee_amount:
          $ref: '#/components/schemas/fee_amount'
        description:
          $ref: '#/components/schemas/description'
        status:
          $ref: '#/components/schemas/transfer_status'
        created_time:
          $ref: '#/components/schemas/created_time'
    transfer-details-response:
      type: object
      properties:
        code:
          type: integer
          example: 0
          readOnly: true
        message:
          type: string
          example: success
          readOnly: true
        transfer_details:
          type: object
          properties:
            transfer_id:
              $ref: '#/components/schemas/transfer_id'
            payment_id:
              $ref: '#/components/schemas/payment_id'
            total_amount:
              $ref: '#/components/schemas/total_amount'
            net_amount:
              $ref: '#/components/schemas/net_amount'
            fee_amount:
              $ref: '#/components/schemas/fee_amount'
            fee_rate:
              $ref: '#/components/schemas/fee_rate'
            fee_tax_amount:
              $ref: '#/components/schemas/fee_tax_amount'
            connected_account_id:
              $ref: '#/components/schemas/connected_account_id'
            description:
              $ref: '#/components/schemas/description'
            currency:
              $ref: '#/components/schemas/currency'
            created_time:
              $ref: '#/components/schemas/created_time'
            status:
              $ref: '#/components/schemas/transfer_status'
            reversed_amount:
              $ref: '#/components/schemas/reversed_amount'
            reversals:
              type: array
              items:
                $ref: '#/components/schemas/transfer-reversal-in-details'
    create-transfer-reversal-request:
      type: object
      required:
        - transfer_id
        - reversal_amount
      properties:
        transfer_id:
          description: The unique identifier of the parent transfer.
          type: number
          format: long
          example: 6485000000046007
        reversal_amount:
          description: The amount to reverse from the transfer.
          type: number
          format: double
          example: 100
        description:
          description: A description for the transfer reversal.
          type: string
          example: Reverse 100
    create-transfer-reversal-response:
      type: object
      properties:
        code:
          type: integer
          example: 0
          readOnly: true
        message:
          type: string
          example: success
          readOnly: true
        data:
          type: object
          properties:
            transfer_reversal:
              type: object
              properties:
                transfer_reversal_id:
                  $ref: '#/components/schemas/transfer_reversal_id'
                currency:
                  $ref: '#/components/schemas/currency'
                transfer_id:
                  $ref: '#/components/schemas/transfer_id'
                transfer_reversal_amount:
                  description: The reversed amount.
                  type: string
                  example: '100.00'
                connected_account_id:
                  $ref: '#/components/schemas/connected_account_id'
                status:
                  $ref: '#/components/schemas/transfer_status'
    transfer-reversal-response:
      type: object
      properties:
        transfer_reversal_id:
          $ref: '#/components/schemas/transfer_reversal_id'
        currency:
          $ref: '#/components/schemas/currency'
        total_amount:
          $ref: '#/components/schemas/total_amount'
        connected_account_id:
          $ref: '#/components/schemas/connected_account_id'
        connected_account_name:
          $ref: '#/components/schemas/connected_account_name'
        status:
          $ref: '#/components/schemas/transfer_status'
        created_time:
          $ref: '#/components/schemas/created_time'
    transfer-reversal-list-response:
      type: object
      properties:
        code:
          type: integer
          example: 0
          readOnly: true
        message:
          type: string
          example: success
          readOnly: true
        transfer_reversals:
          type: array
          items:
            $ref: '#/components/schemas/transfer-reversal-response'
    connected-account-bank-account-response:
      type: object
      properties:
        connected_account_bank_account_id:
          description: The unique identifier of the connected account bank account.
          type: string
          example: '4000000003011'
        currency:
          $ref: '#/components/schemas/currency'
        routing_number:
          description: The IFSC code of the bank account.
          type: string
          example: ICIC00002
        last_four_digits:
          description: The last four digits of the bank account number.
          type: string
          example: '9013'
        account_holder_name:
          description: The name of the account holder.
          type: string
          example: John Doe
        status:
          description: The status of the bank account. It can be <code>active</code> or <code>inactive</code>.
          type: string
          example: active
        verification_status:
          description: The verification status of the bank account. It can be <code>pending</code> or <code>verified</code>.
          type: string
          example: verified
        created_by:
          $ref: '#/components/schemas/created_by'
        last_modified_by:
          $ref: '#/components/schemas/last_modified_by'
        created_time:
          $ref: '#/components/schemas/created_time'
        last_modified_time:
          $ref: '#/components/schemas/last_modified_time'
    connected-account-list-item:
      type: object
      properties:
        connected_account_id:
          $ref: '#/components/schemas/connected_account_id'
        first_name:
          $ref: '#/components/schemas/first_name'
        last_name:
          $ref: '#/components/schemas/last_name'
        under_writing_status:
          $ref: '#/components/schemas/under_writing_status'
        created_by:
          $ref: '#/components/schemas/created_by'
        last_modified_by:
          $ref: '#/components/schemas/last_modified_by'
        created_time:
          $ref: '#/components/schemas/created_time'
        last_modified_time:
          $ref: '#/components/schemas/last_modified_time'
    connected-account-list-response:
      type: object
      properties:
        code:
          type: integer
          example: 0
          readOnly: true
        message:
          type: string
          example: success
          readOnly: true
        connected_accounts:
          type: array
          items:
            $ref: '#/components/schemas/connected-account-list-item'
    connected-account-detail:
      type: object
      properties:
        connected_account_id:
          $ref: '#/components/schemas/connected_account_id'
        first_name:
          $ref: '#/components/schemas/first_name'
        last_name:
          $ref: '#/components/schemas/last_name'
        email_id:
          $ref: '#/components/schemas/email_id'
        phone_number:
          $ref: '#/components/schemas/phone_number'
        business_name:
          description: The business name of the connected account.
          type: string
          example: Doe Enterprises
        account_name:
          description: The account name of the connected account.
          type: string
          example: johndoe
        business_type:
          description: The business type of the connected account.
          type: string
          example: llp
        dob:
          description: The date of birth of the connected account.
          type: string
          example: 01-01-1990
        under_writing_status:
          $ref: '#/components/schemas/under_writing_status'
        transfer_status:
          description: The transfer status of the connected account. It can be <code>enabled</code> or <code>disabled</code>.
          type: string
          example: enabled
        payout_status:
          description: The payout status of the connected account. It can be <code>enabled</code>, <code>disabled</code>, or <code>paused_by_risk</code>.
          type: string
          example: disabled
        payout_delay_days:
          description: The number of days payouts are delayed.
          type: integer
          example: 0
        created_by:
          $ref: '#/components/schemas/created_by'
        last_modified_by:
          $ref: '#/components/schemas/last_modified_by'
        created_time:
          $ref: '#/components/schemas/created_time'
        last_modified_time:
          $ref: '#/components/schemas/last_modified_time'
        connected_account_bank_accounts:
          type: array
          items:
            $ref: '#/components/schemas/connected-account-bank-account-response'
    connected-account-details-response:
      type: object
      properties:
        code:
          type: integer
          example: 0
          readOnly: true
        message:
          type: string
          example: success
          readOnly: true
        connected_account:
          $ref: '#/components/schemas/connected-account-detail'
    connected-account-payout-item:
      type: object
      properties:
        payout_id:
          description: The unique identifier of the payout.
          type: string
          example: '3000000054061'
        amount:
          description: The payout amount.
          type: string
          example: '100.0'
        currency:
          $ref: '#/components/schemas/currency'
        status:
          description: The payout status. It can be <code>initiated</code>, <code>paid</code>, or <code>failed</code>.
          type: string
          example: initiated
        failure_code:
          description: The failure code of the payout, if any.
          type: string
          example: ''
        failure_message:
          description: The failure message of the payout, if any.
          type: string
          example: ''
        statement_descriptor:
          description: The payout descriptor.
          type: string
          example: ''
        payout_method:
          description: The payout method. It can be <code>standard</code>.
          type: string
          example: standard
        initiated_time:
          description: The timestamp (milliseconds) indicating when the payout was initiated.
          type: string
          example: '1750681308996'
        arrival_date:
          description: The expected arrival date of the payout.
          type: string
          example: '1750681308996'
        processed_date:
          description: The date on which the payout was processed.
          type: string
          example: ''
        type:
